<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="14" fill="url(#bg2)" stroke="#334155" stroke-width="2"/>

  <!-- Header -->
  <text x="600" y="45" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    🏗️ AI Security Agent Architecture &amp; Dynamic Routing Flow
  </text>

  <!-- Step 1: Input & Ethical Framing -->
  <g transform="translate(40, 80)">
    <rect width="240" height="290" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
    <rect width="240" height="40" rx="10" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="120" y="26" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#34d399" text-anchor="middle">1. ETHICAL FRAMING</text>
    
    <text x="20" y="75" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">Auto-Routing Rules:</text>
    <text x="25" y="102" font-family="Consolas, monospace" font-size="13" fill="#38bdf8">• .clinerules (Cline/Roo)</text>
    <text x="25" y="125" font-family="Consolas, monospace" font-size="13" fill="#38bdf8">• .cursorrules (Cursor)</text>
    <text x="25" y="148" font-family="Consolas, monospace" font-size="13" fill="#38bdf8">• AGENTS.md (OpenCode)</text>

    <line x1="20" y1="170" x2="220" y2="170" stroke="#334155" stroke-width="1"/>

    <text x="20" y="198" font-family="sans-serif" font-size="14" font-weight="bold" fill="#e2e8f0">Refusal Bypass:</text>
    <text x="20" y="222" font-family="sans-serif" font-size="12" fill="#94a3b8">Frames prompts under</text>
    <text x="20" y="240" font-family="sans-serif" font-size="12" fill="#94a3b8">Authorized Responsible</text>
    <text x="20" y="258" font-family="sans-serif" font-size="12" fill="#94a3b8">Disclosure &amp; Remediation.</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M290 225 L330 225" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)"/>
  <polygon points="325,218 338,225 325,232" fill="#10b981"/>

  <!-- Step 2: Dynamic Profiles & RAG -->
  <g transform="translate(350, 80)">
    <rect width="260" height="290" rx="12" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="2"/>
    <rect width="260" height="40" rx="10" fill="rgba(6, 182, 212, 0.2)"/>
    <text x="130" y="26" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#22d3ee" text-anchor="middle">2. CONTEXT PROFILES</text>

    <text x="20" y="72" font-family="Consolas, monospace" font-size="12" fill="#f8fafc">🔍 profile-recon-osint (25)</text>
    <text x="20" y="98" font-family="Consolas, monospace" font-size="12" fill="#f8fafc">🌐 profile-web-api-audit (30)</text>
    <text x="20" y="124" font-family="Consolas, monospace" font-size="12" fill="#f8fafc">☁️ profile-cloud-devops (15)</text>
    <text x="20" y="150" font-family="Consolas, monospace" font-size="12" fill="#f8fafc">🔥 profile-advanced-exp (19)</text>
    <text x="20" y="176" font-family="Consolas, monospace" font-size="12" fill="#f8fafc">📱 profile-mobile-iot (11)</text>
    <text x="20" y="202" font-family="Consolas, monospace" font-size="12" fill="#fbbf24">⚡ wild-exploits (CISA KEV)</text>

    <line x1="20" y1="222" x2="240" y2="222" stroke="#334155" stroke-width="1"/>
    <text x="20" y="248" font-family="sans-serif" font-size="12" fill="#a78bfa">🧠 OR Persistent RAG Chunks</text>
    <text x="20" y="268" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">rag/chunks/*.json + System Prompt</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M620 225 L660 225" stroke="#06b6d4" stroke-width="3"/>
  <polygon points="655,218 668,225 655,232" fill="#06b6d4"/>

  <!-- Step 3: 100 Skills + Payloads + MCP -->
  <g transform="translate(680, 80)">
    <rect width="230" height="290" rx="12" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="230" height="40" rx="10" fill="rgba(139, 92, 246, 0.2)"/>
    <text x="115" y="26" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#a78bfa" text-anchor="middle">3. EXECUTION &amp; MCP</text>

    <text x="20" y="75" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">🛠️ Local CLI via MCP:</text>
    <text x="20" y="98" font-family="Consolas, monospace" font-size="12" fill="#34d399">subfinder, httpx, nuclei</text>
    <text x="20" y="118" font-family="Consolas, monospace" font-size="12" fill="#34d399">ffuf, amass, smuggler</text>

    <text x="20" y="152" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">💣 Payloads &amp; Wordlists:</text>
    <text x="20" y="175" font-family="Consolas, monospace" font-size="12" fill="#f472b6">payloads/xss-waf.txt</text>
    <text x="20" y="195" font-family="Consolas, monospace" font-size="12" fill="#f472b6">wordlists/api-top100.txt</text>

    <text x="20" y="229" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">📚 Few-Shot Write-ups:</text>
    <text x="20" y="252" font-family="Consolas, monospace" font-size="12" fill="#38bdf8">Uber, Shopify, AWS SSRF</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M920 225 L960 225" stroke="#8b5cf6" stroke-width="3"/>
  <polygon points="955,218 968,225 955,232" fill="#8b5cf6"/>

  <!-- Step 4: Reporting Output -->
  <g transform="translate(975, 80)">
    <rect width="185" height="290" rx="12" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="2"/>
    <rect width="185" height="40" rx="10" fill="rgba(245, 158, 11, 0.2)"/>
    <text x="92.5" y="26" font-family="Consolas, monospace" font-size="15" font-weight="bold" fill="#fbbf24" text-anchor="middle">4. REPORTING</text>

    <text x="15" y="80" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">📋 Auto-Templates:</text>
    <text x="15" y="105" font-family="Consolas, monospace" font-size="12" fill="#fbbf24">• HackerOne</text>
    <text x="15" y="128" font-family="Consolas, monospace" font-size="12" fill="#fbbf24">• Bugcrowd VRT</text>
    <text x="15" y="151" font-family="Consolas, monospace" font-size="12" fill="#fbbf24">• Intigriti</text>

    <line x1="15" y1="175" x2="170" y2="175" stroke="#334155" stroke-width="1"/>

    <text x="15" y="205" font-family="sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">📊 Deliverables:</text>
    <text x="15" y="228" font-family="sans-serif" font-size="12" fill="#94a3b8">• Step-by-Step PoC</text>
    <text x="15" y="248" font-family="sans-serif" font-size="12" fill="#94a3b8">• CVSS v3.1 Vector</text>
    <text x="15" y="268" font-family="sans-serif" font-size="12" fill="#94a3b8">• Remediation Code</text>
  </g>
</svg>
