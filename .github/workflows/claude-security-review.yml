name: Claude AI Security Review

permissions:
  pull-requests: write # Permiso para comentar los hallazgos directamente en el PR
  contents: read       # Permiso para analizar los diffs del repositorio

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  security-review:
    name: Claude Code Semantic Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Diff Context
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Run Claude Code Security Review Action
        uses: anthropics/claude-code-security-review@main
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY || secrets.ANTHROPIC_API_KEY }}
